name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
    -C target-feature=+avx512f,+avx512bw,+avx512dq,+avx512ifma

jobs:
  checks:
    name: Compile and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.89.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check verification report and audit evidence regressions
        run: python3 -B verification/test_evidence.py

      - name: Compile all targets
        run: >-
          cargo check --workspace --all-targets --locked
          --target x86_64-unknown-linux-gnu

      - name: Run Clippy
        run: >-
          cargo clippy --workspace --all-targets --locked
          --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Compile and lint all assembly backends
        run: >-
          cargo clippy --workspace --all-targets --locked
          --features asm-pow2,asm-double4,asm-cached-add,asm-scalar
          --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Test all assembly backends when AVX-512 is available
        run: |
          if grep -qw avx512ifma /proc/cpuinfo && grep -qw avx512dq /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo && grep -qw avx512f /proc/cpuinfo; then
            cargo test --locked --release --features asm-pow2,asm-double4,asm-cached-add,asm-scalar --target x86_64-unknown-linux-gnu
          else
            cargo test --locked --release --features asm-pow2,asm-double4,asm-cached-add,asm-scalar --no-run --target x86_64-unknown-linux-gnu
          fi

      # Mirrors docs.rs: no AVX-512 flags, so this also pins the `not(doc)`
      # escape from the crate's compile_error gate.
      - name: Build documentation
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ''
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Build all assembly backends
        run: |
          cargo build --locked --release --features asm-pow2,asm-double4,asm-cached-add,asm-scalar --bench cold_profile_zip215 \
            --target x86_64-unknown-linux-gnu --message-format=json > "$RUNNER_TEMP/pow2-build.json"

      - name: Check the build-time proof and the linked assembly-only release binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-z3 coq llvm
          cargo build --locked --release --features verify-asm-pow2,verify-asm-double4,verify-asm-cached-add,verify-asm-scalar --lib --target x86_64-unknown-linux-gnu
          artifact=$(jq -r 'select(.target.name == "cold_profile_zip215" and .executable != null) | .executable' "$RUNNER_TEMP/pow2-build.json")
          /usr/bin/python3 verification/pow2/check.py "$artifact"
          /usr/bin/python3 verification/pow2/coq_proof.py "$artifact" \
            --output "$RUNNER_TEMP/pow2-audit" --cases "$RUNNER_TEMP/pow2-cases.jsonl" --seed 42
          /usr/bin/python3 verification/double4/audit.py "$artifact" \
            --output "$RUNNER_TEMP/double4-audit" --cases "$RUNNER_TEMP/double4-cases.jsonl" --seed 42
          /usr/bin/python3 verification/cached_add/audit.py "$artifact" \
            --output "$RUNNER_TEMP/cached-add-audit" --cases "$RUNNER_TEMP/cached-add-cases.jsonl" --seed 42
          /usr/bin/python3 verification/scalar/audit.py "$artifact" \
            --output "$RUNNER_TEMP/scalar-audit" --cases "$RUNNER_TEMP/scalar-cases.jsonl" --seed 42

      - name: Check cached-add and scalar proof mutation rejection
        run: |
          native=
          if grep -qw avx512ifma /proc/cpuinfo && grep -qw avx512dq /proc/cpuinfo && grep -qw avx512f /proc/cpuinfo; then
            native=--native
          fi
          python3 -B verification/cached_add/mutations.py \
            --output "$RUNNER_TEMP/cached-add-mutations" $native
          python3 -B verification/scalar/mutations.py \
            --output "$RUNNER_TEMP/scalar-mutations" $native

      - name: Check the fixed machine corpus and linked kernel rows
        run: |
          export XED_KIT="$RUNNER_TEMP/xed-kit"
          verification/machine/tests/xed/build-kit.sh "$XED_KIT"
          backend=xed
          if grep -qw avx512ifma /proc/cpuinfo && grep -qw avx512dq /proc/cpuinfo && grep -qw avx512f /proc/cpuinfo; then
            backend=all
          else
            echo "Native comparison skipped on this runner (requires AVX-512F/DQ/IFMA)."
          fi
          python3 -B verification/machine/tests/run.py --backend "$backend" \
            --report "$RUNNER_TEMP/fixed-report.json" --failure "$RUNNER_TEMP/machine-failure.json"
          python3 -B verification/machine/tests/run.py --backend "$backend" --cases "$RUNNER_TEMP/pow2-cases.jsonl" \
            --report "$RUNNER_TEMP/pow2-report.json" --failure "$RUNNER_TEMP/machine-failure.json"
          python3 -B verification/machine/tests/run.py --backend "$backend" --cases "$RUNNER_TEMP/double4-cases.jsonl" \
            --report "$RUNNER_TEMP/double4-report.json" --failure "$RUNNER_TEMP/machine-failure.json"
          python3 -B verification/machine/tests/run.py --backend "$backend" --cases "$RUNNER_TEMP/cached-add-cases.jsonl" \
            --report "$RUNNER_TEMP/cached-add-report.json" --failure "$RUNNER_TEMP/machine-failure.json"
          python3 -B verification/machine/tests/run.py --backend "$backend" --cases "$RUNNER_TEMP/scalar-cases.jsonl" \
            --report "$RUNNER_TEMP/scalar-report.json" --failure "$RUNNER_TEMP/machine-failure.json"

      - name: Retain conformance reports, inputs, and release proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-conformance
          path: |
            ${{ runner.temp }}/*-report.json
            ${{ runner.temp }}/machine-failure.json
            ${{ runner.temp }}/pow2-cases.jsonl
            ${{ runner.temp }}/pow2-audit/
            ${{ runner.temp }}/double4-cases.jsonl
            ${{ runner.temp }}/double4-audit/
            ${{ runner.temp }}/cached-add-cases.jsonl
            ${{ runner.temp }}/cached-add-audit/
            ${{ runner.temp }}/cached-add-mutations/
            ${{ runner.temp }}/scalar-cases.jsonl
            ${{ runner.temp }}/scalar-audit/
            ${{ runner.temp }}/scalar-mutations/
          if-no-files-found: ignore
