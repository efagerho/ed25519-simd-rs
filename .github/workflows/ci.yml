name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
    -C target-feature=+avx512f,+avx512bw,+avx512dq,+avx512ifma

jobs:
  checks:
    name: Compile and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.89.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: >-
          cargo check --workspace --all-targets --locked
          --target x86_64-unknown-linux-gnu

      - name: Run Clippy
        run: >-
          cargo clippy --workspace --all-targets --locked
          --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Test all assembly backends when AVX-512 is available
        run: |
          if grep -qw avx512ifma /proc/cpuinfo && grep -qw avx512dq /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo && grep -qw avx512f /proc/cpuinfo; then
            cargo test --locked --release --target x86_64-unknown-linux-gnu
          else
            cargo test --locked --release --no-run --target x86_64-unknown-linux-gnu
          fi

      # Mirrors docs.rs: no AVX-512 flags, so this also pins the `not(doc)`
      # escape from the crate's compile_error gate.
      - name: Build documentation
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ''
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Link release binaries for the assembly audits
        run: |
          cargo build --locked --release --features asm --bench cold_profile_dalek \
            --target x86_64-unknown-linux-gnu --message-format=json > "$RUNNER_TEMP/release-build.json"
          # Keep both Rust-facing entries and the queue symbols used by their callee certificates.
          cargo rustc --locked --release --features asm --bench cold_profile_dalek \
            --target x86_64-unknown-linux-gnu --message-format=json -- \
            -C link-arg=-Wl,--undefined=ed25519_simd_zip215_verify_batch,--undefined=ed25519_simd_zip215_push,--undefined=ed25519_simd_dalek_push \
            > "$RUNNER_TEMP/policies-build.json"

      - name: Build shared Coq libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-z3 coq libcoq-coqprime llvm time
          python3 -B verification/proof_build.py "$RUNNER_TEMP/shared-coq" --jobs 4
          echo "ED25519_SIMD_COQ_LIBRARIES=$RUNNER_TEMP/shared-coq" >> "$GITHUB_ENV"

      - name: Check verification report and audit evidence regressions
        run: python3 -B verification/test_evidence.py

      - name: Verify release proofs, mutation rejection and machine conformance
        run: |
          artifact=$(jq -r 'select(.target.name == "cold_profile_dalek" and .executable != null) | .executable' "$RUNNER_TEMP/release-build.json")
          policy_elf=$(jq -r 'select(.target.name == "cold_profile_dalek" and .executable != null) | .executable' "$RUNNER_TEMP/policies-build.json")
          test -x "$artifact" && test -x "$policy_elf"
          backend=xed
          if grep -qw avx512ifma /proc/cpuinfo && grep -qw avx512dq /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo && grep -qw avx512f /proc/cpuinfo; then
            backend=all
          else
            echo "Native comparison skipped on this runner (requires AVX-512F/BW/DQ/IFMA)."
          fi
          make -f .github/verification.mk -j4 --keep-going --output-sync=target verify \
            RELEASE_ELF="$artifact" POLICY_ELF="$policy_elf" MACHINE_BACKEND="$backend"

      - name: Retain conformance reports, inputs, and release proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-conformance
          path: |
            ${{ runner.temp }}/*-report.json
            ${{ runner.temp }}/*-failure.json
            ${{ runner.temp }}/pow2-cases.jsonl
            ${{ runner.temp }}/pow2-audit/
            ${{ runner.temp }}/double4-cases.jsonl
            ${{ runner.temp }}/double4-audit/
            ${{ runner.temp }}/cached-add-cases.jsonl
            ${{ runner.temp }}/cached-add-audit/
            ${{ runner.temp }}/cached-add-mutations/
            ${{ runner.temp }}/full-ladder-audit/
            ${{ runner.temp }}/key-table-audit/
            ${{ runner.temp }}/torsion-audit/
            ${{ runner.temp }}/small-order-audit/
            ${{ runner.temp }}/decompress-r-audit/
            ${{ runner.temp }}/prepare-chunk-audit/
            ${{ runner.temp }}/dalek-post-hash-audit/
            ${{ runner.temp }}/dalek-recompress-audit/
            ${{ runner.temp }}/zip215-audit/
            ${{ runner.temp }}/verify-batch-audit/
            ${{ runner.temp }}/scalar-cases.jsonl
            ${{ runner.temp }}/scalar-audit/
            ${{ runner.temp }}/sha512-challenge-audit/
            ${{ runner.temp }}/signature-scalar-audit/
            ${{ runner.temp }}/radix16-audit/
            ${{ runner.temp }}/scalar-mutations/
          if-no-files-found: ignore
